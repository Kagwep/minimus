[package]
name = "minimus-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Optimized ML inference SDK for embedded and mobile devices"
license = "MIT"
repository = "https://github.com/yourusername/minimus-sdk"
keywords = ["machine-learning", "inference", "embedded", "mobile", "onnx"]
categories = ["science", "embedded", "wasm"]
readme = "README.md"

[dependencies]
# ML Runtime
tract-onnx = "0.21"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Async & networking (optional, for model downloading)
reqwest = { version = "0.11", features = ["rustls-tls"], optional = true }
tokio = { version = "1", features = ["rt", "fs"], optional = true }

# Utilities
thiserror = "1.0"
sha2 = { version = "0.10", optional = true }
base64 = "0.21"
once_cell = "1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Platform-specific cache directory
dirs = { version = "5.0", optional = true }

[features]
default = ["download"]
download = ["reqwest", "tokio", "sha2", "dirs"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
