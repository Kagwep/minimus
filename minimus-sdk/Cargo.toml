[package]
name = "minimus-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Peter Kagwe <peterkagwe698@gmail.com>"]
description = "Optimized ML inference SDK for embedded and mobile devices"
license = "MIT"
repository = "https://github.com/Kagwep/minimus"
homepage = "https://github.com/Kagwep/minimus"
documentation = "https://docs.rs/minimus-sdk"
keywords = ["machine-learning", "inference", "embedded", "mobile", "onnx"]
categories = ["science", "embedded", "wasm"]
readme = "README.md"

[dependencies]
# ML Runtime
tract-onnx = "0.22.0"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Async & networking (optional, for model downloading)
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"], optional = true }
tokio = { version = "1", features = ["rt", "fs"], optional = true }

# Utilities
thiserror = "1.0"
sha2 = { version = "0.10", optional = true }
base64 = "0.21"
once_cell = "1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Platform-specific cache directory
dirs = { version = "5.0", optional = true }
tract-nnef = "0.22.0"
uuid = "1.20.0"
tar = "0.4.44"

[features]
default = ["download"]
download = ["reqwest", "tokio", "sha2", "dirs"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
